<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Task Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 40px;
      color: #222;
    }

    .container {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0001;
    }

    h1 {
      margin-top: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    input {
      flex: 1;
      min-width: 150px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
    }

    button:hover {
      background: #1d4ed8;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #b91c1c;
    }

    .task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #eee;
      border-radius: 8px;
    }

    .task.completed .task-name {
      text-decoration: line-through;
      color: gray;
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .badge {
      font-size: 12px;
      background: #e5e7eb;
      padding: 5px 8px;
      border-radius: 5px;
    }

    #taskCount {
      margin: 15px 0;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Task Dashboard</h1>

    <div class="controls">
      <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task"
      />

      <select id="priorityInput">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

      <button id="addTaskBtn">Add Task</button>
    </div>

    <div class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Search tasks..."
      />

      <select id="statusFilter">
        <option value="all">All Tasks</option>
        <option value="active">Active</option>
        <option value="completed">Completed</option>
      </select>

      <select id="priorityFilter">
        <option value="all">All Priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </div>

    <div class="controls">
      <button id="sortBtn">Sort A-Z</button>
      <button id="randomBtn">Add Random Task</button>
      <button id="clearCompletedBtn">
        Clear Completed
      </button>
      <button id="resetBtn" class="danger">
        Reset All
      </button>
    </div>

    <p id="taskCount"></p>

    <div id="taskList"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
